title: Okta Service Account Token Use From Untrusted Source
id: okta_service_account_token_use
status: test
description: Service account token activity from an untrusted source context.
logsource:
  product: okta
  service: system
detection:
  selection:
    eventType: system.api_token.request
    actor.type: ServiceAccount
    client.zone: untrusted
  condition: selection
falsepositives:
  - Newly moved automation runner without updated source inventory.
level: high

