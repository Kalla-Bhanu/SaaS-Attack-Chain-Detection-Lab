title: Okta Credential Failure Pressure
id: okta_credential_failure_pressure
status: test
description: Multiple failed Okta authentication attempts for the same modeled user inside a short window.
logsource:
  product: okta
  service: system
detection:
  selection:
    eventType: user.authentication.failed
    outcome.result: FAILURE
  condition: selection
falsepositives:
  - Password manager retries or legitimate forgotten-password activity.
level: medium

